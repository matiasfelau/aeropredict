version: "3.9"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: aeropredict-postgres
    environment:
      POSTGRES_USER: aeropredict_user
      POSTGRES_PASSWORD: aeropredict_password
      POSTGRES_DB: aeropredict
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeropredict_user -d aeropredict"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aeropredict-backend
    environment:
      DATABASE_URL: postgresql://aeropredict_user:aeropredict_password@postgres:5432/aeropredict
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-in-production}
      DEBUG: ${DEBUG:-false}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/__pycache__
    command: bash -c "python -m alembic upgrade head && python -m uvicorn src.backend.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
    driver: local
